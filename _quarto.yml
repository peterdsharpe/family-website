project:
  type: website
  resources:
    - assets
    - theme/fonts/OFL.txt
    - CNAME
    - .nojekyll

website:
  title: "PeteMart"
  site-url: https://petem.art
  description: "The family website of Peter and Marta, in Somerville, Massachusetts."
  favicon: assets/favicon.svg
  image: assets/goose-card.jpg
  image-alt: "A watercolor of a Canada goose in a meadow, painted by Peter."
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  navbar:
    collapse: false
    pinned: false
    right:
      - href: blog.qmd
        text: Journal
      - href: about.qmd
        text: About
  page-footer:
    left: "Peter and Marta, Somerville, Massachusetts"
    right:
      - text: RSS
        href: blog.xml
      - text: Source
        href: https://github.com/peterdsharpe/family-website

language:
  search-matching-documents-text: "found"
  search-no-results-text: "Nothing found"

format:
  html:
    theme:
      light: [theme/light.scss, theme/site.scss]
      dark: [theme/dark.scss, theme/site.scss]
    respect-user-color-scheme: true
    include-in-header: theme/head.html
    lang: en-US
    date-format: "MMMM D, YYYY"
    smooth-scroll: false
    anchor-sections: true
    code-copy: hover
    code-overflow: wrap
    highlight-style:
      light: gruvbox-light
      dark: gruvbox-dark
    link-external-newwindow: false
