<header id="title-block-header" class="pm-title-block">
$if(title)$
<h1 class="title">$title$</h1>
$endif$
$if(subtitle)$
<p class="subtitle">$subtitle$</p>
$elseif(description)$
<p class="subtitle">$description$</p>
$endif$
<p class="pm-byline">
$if(date)$<time class="date">$date$</time>$endif$$if(by-author)$ · $for(by-author)$$by-author.name.literal$$sep$ and $endfor$$endif$$if(categories)$ · <span class="pm-cats">$for(categories)$$categories$$sep$, $endfor$</span>$endif$
</p>
</header>
